# Publishes @fieldmaps/core and @fieldmaps/field-map as a GitHub pre-release when a
# field-map-v* tag is pushed. A tag rather than every push, because another app
# installs from the release URLs: a release is a decision to move them, and the URLs
# of the one they are on must keep working.
#
#   git tag field-map-v0.1.0-pre.2 && git push origin field-map-v0.1.0-pre.2
#
# Update the tag in packages/field-map/LOVABLE.md first (it ships in the tarball, with
# the install URLs in it); the run fails if that file names another release.
name: field-map release

on:
  push:
    tags: ["field-map-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check LOVABLE.md names this release
        run: |
          if grep -o 'field-map-v[0-9][0-9A-Za-z.+-]*' packages/field-map/LOVABLE.md | grep -vqx "$TAG"; then
            echo "::error file=packages/field-map/LOVABLE.md::It names another release; replace its tag with $TAG, commit, and move the tag."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build:packages

      - name: Pack
        run: |
          mkdir release
          npm pack -w @fieldmaps/core -w @fieldmaps/field-map --pack-destination release
          ls -l release

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          core=$(cd release && ls fieldmaps-core-*.tgz)
          element=$(cd release && ls fieldmaps-field-map-*.tgz)
          cat > notes.md <<EOF
          Pre-release of the \`<field-map>\` element and \`@fieldmaps/core\`, built from \`${GITHUB_SHA::7}\`. Not merged into \`main\` yet; expect changes.

          ## Install

          \`\`\`sh
          npm install lit leaflet \\
            ${base}/${core} \\
            ${base}/${element}
          \`\`\`

          \`lit\` and \`leaflet\` are peer dependencies. The integration guide ships inside the package: \`node_modules/@fieldmaps/field-map/AGENTS.md\` (\`LOVABLE.md\` next to it for a Lovable project). Moving from an earlier pre-release: replace the two URLs in \`package.json\`.
          EOF
          gh release create "$TAG" release/*.tgz \
            --prerelease --verify-tag \
            --title "<field-map> ${TAG#field-map-v}" \
            --notes-file notes.md --generate-notes
